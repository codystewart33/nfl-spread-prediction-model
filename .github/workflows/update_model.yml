
name: Update NFL model

on:
  workflow_dispatch:

  schedule:
    - cron: "15 9 * * 2"
      timezone: "America/New_York"

permissions:
  contents: write

jobs:
  update-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild NFL predictions
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python build_predictions.py

      - name: Freeze pregame lines and grade finished games
        run: python track_results.py

      - name: Save generated data back to GitHub
        run: |
          git config user.name "NFL Model Bot"
          git config user.email "actions@github.com"

          git add data/current_predictions.csv data/model_metadata.json data/prediction_history.csv

          if git diff --staged --quiet; then
            echo "No prediction changes to commit."
          else
            git commit -m "Update NFL model and tracked results"
            git push
          fi
